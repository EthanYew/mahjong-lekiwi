[pytest]
testpaths = tests
# The shell sources ROS 2 Jazzy, whose pytest plugins (launch_testing's breaks on pytest 9) aren't
# needed here.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_pep257 -p no:ament_flake8 -p no:ament_lint
          -p no:ament_xmllint -p no:ament_copyright
markers =
    slow: loads policies / datasets and needs the GPU (deselect with -m "not slow")
