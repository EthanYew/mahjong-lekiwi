{%- assign d = site.data.story | where: "n", include.n | first -%}
<header class="draw-head">
  <span class="mt {{ d.suit }}" aria-hidden="true"><b{% if d.glyph %} class="g"{% endif %}>{{ d.face }}</b><i>{{ d.label }}</i></span>
  <div>
    <p class="mj-eyebrow">Draw {{ d.n }} of 14 · {{ d.act }}</p>
    <h2>{{ d.title }}</h2>
  </div>
</header>
